<style>
.l{animation-name:fall;animation-timing-function:linear;animation-iteration-count:infinite}
@keyframes fall{0%{transform:translate(0,0) rotate(0);opacity:0}8%{opacity:1}50%{transform:translate(calc(var(--dx)*.4),170px) rotate(calc(var(--r)*.5))}92%{opacity:1}100%{transform:translate(var(--dx),350px) rotate(var(--r));opacity:0}}
.rip{animation:rip 4s ease-in-out infinite}
@keyframes rip{0%,100%{opacity:.15;transform:scaleX(.85)}50%{opacity:.5;transform:scaleX(1.05)}}
.moon{animation:pulse 6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.7}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){.l,.rip,.moon{animation:none}}
</style>
