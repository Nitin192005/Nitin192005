name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Nitin192005
          outputs: |
            dist/github-snake.svg?color_snake=%23ff9eb5&color_dots=%230d0820,%2327113a,%236c244f,%23d6264f,%23ff9eb5
            dist/github-snake-dark.svg?color_snake=%23ff9eb5&color_dots=%230d0820,%2327113a,%236c244f,%23d6264f,%23ff9eb5

      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: output
          publish_dir: ./dist
