name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Nitin192005
          outputs: |
            dist/github-snake.svg?color_snake=%23f29aa3&color_dots=%232b2438,%23533b53,%23b95068,%23e4777e,%23ffc1a1
            dist/github-snake-dark.svg?color_snake=%23f29aa3&color_dots=%232b2438,%23533b53,%23b95068,%23e4777e,%23ffc1a1

      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: output
          publish_dir: ./dist
