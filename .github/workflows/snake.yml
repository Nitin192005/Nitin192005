name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Nitin192005
          outputs: |
            dist/github-snake.svg?color_snake=%232da44e&color_dots=%23ffffff,%23d3f2d6,%239be9a8,%2340c463,%232da44e
            dist/github-snake-dark.svg?color_snake=%2339d353&color_dots=%230d1117,%230e4429,%23006d32,%2326a641,%2339d353

      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: output
          publish_dir: ./dist
